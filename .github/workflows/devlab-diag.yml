name: DevLab Diagnostic

# Temporary. Does things on the Strix Halo that need a shell on the box, by
# running as a job on it. Delete once the host is in the state we want.

on:
  workflow_dispatch:

jobs:
  pull-model:
    name: Strix Halo - pull Gemma
    runs-on: [self-hosted, Linux, halo]
    timeout-minutes: 45
    steps:
      - name: Before
        run: |
          echo "user: $(whoami)"
          lemonade --version
          df -h /home /var 2>/dev/null | sed -n '1,6p'
          curl -s --max-time 10 http://127.0.0.1:13305/api/v1/models > /tmp/before.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/before.json"))
          items = d.get("data", d) if isinstance(d, dict) else d
          print(f"{len(items)} model(s) before")
          for m in items:
              print("  ", m.get("id"))
          PY

      - name: Pull Gemma-4-E2B-it-GGUF
        run: |
          # ~4 GB from Hugging Face. The daemon runs as user `lemonade`, so the
          # model lands in its store and outlives this ephemeral runner --
          # which is the point: the playbook test only checks presence.
          lemonade pull Gemma-4-E2B-it-GGUF

      - name: After
        run: |
          curl -s --max-time 10 http://127.0.0.1:13305/api/v1/models > /tmp/after.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/after.json"))
          items = d.get("data", d) if isinstance(d, dict) else d
          print(f"{len(items)} model(s) after")
          hit = None
          for m in items:
              print("  {}  downloaded={}".format(m.get("id"), m.get("downloaded")))
              if m.get("id") == "Gemma-4-E2B-it-GGUF":
                  hit = m
          if not hit:
              sys.exit("Gemma-4-E2B-it-GGUF still absent from /api/v1/models")
          if not hit.get("downloaded"):
              sys.exit("Gemma-4-E2B-it-GGUF listed but not downloaded")
          print("OK: Gemma-4-E2B-it-GGUF present and downloaded")
          PY
